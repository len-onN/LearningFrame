services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-learningframe}
      MYSQL_USER: ${DB_USER:-learningframe}
      MYSQL_PASSWORD: ${DB_PASSWORD:-learningframe}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-learningframe_root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-learningframe}
      DB_USER: ${DB_USER:-learningframe}
      DB_PASSWORD: ${DB_PASSWORD:-learningframe}
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-secret-at-least-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8081
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
