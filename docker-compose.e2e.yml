services:
  db-e2e:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: learningframe_e2e
      MYSQL_USER: learningframe_e2e
      MYSQL_PASSWORD: learningframe_e2e
      MYSQL_ROOT_PASSWORD: learningframe_e2e_root
    ports:
      - "3317:3306"
    volumes:
      - mysql-e2e-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-e2e:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      DB_HOST: db-e2e
      DB_PORT: 3306
      DB_NAME: learningframe_e2e
      DB_USER: learningframe_e2e
      DB_PASSWORD: learningframe_e2e
      JWT_SECRET: learningframe-e2e-jwt-secret-with-at-least-32-chars
      CORS_ALLOWED_ORIGINS: http://localhost:18080,http://127.0.0.1:18080
      E2E_RESET_TOKEN: learningframe-e2e-reset-token
    ports:
      - "18081:8081"
    depends_on:
      db-e2e:
        condition: service_healthy

  frontend-e2e:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:18081
    ports:
      - "18080:80"
    depends_on:
      - backend-e2e

volumes:
  mysql-e2e-data:
